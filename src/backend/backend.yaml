components:
  schemas:
    Acompanhante:
      type: object
      properties:
        id_acompanhante:
          type: integer
          example: 1
        nome_acompanhante:
          type: string
          example: "Carlos Silva"
        email_acompanhante:
          type: string
          example: "carlos@email.com"
        id_gestante:
          type: integer
          description: "ID da gestante em que ele está cadastrado"
          example: 5
        nome_gestante:
          type: string
          description: "Nome da gestante em que ele está cadastrado"
          example: "Ana Paula"

    Usuario:
      type: object
      properties:
        id_usuario:
          type: integer
          example: 1
        nome:
          type: string
          example: "Ana Paula"
        email:
          type: string
          example: "ana@email.com"
        perfil:
          type: string
          example: "gestante"

    Dica:
      type: object
      properties:
        id_dica:
          type: integer
          example: 1
        id_usuario:
          type: integer
          example: 1
        titulo:
          type: string
          example: "Cuidados com a pressão"
        descricao:
          type: string
          example: "Monitore sua pressão arterial regularmente."
        categoria:
          type: string
          example: "Saúde"
        link_referencia:
          type: string
          example: "https://exemplo.com"
        criada_em:
          type: string
          format: date-time
          example: "2026-06-01T10:00:00Z"

    Erro:
      type: object
      properties:
        erro:
          type: string
          example: "Ocorreu um erro ao processar a requisição."

    MensagemSucesso:
      type: object
      properties:
        mensagem:
          type: string
          example: "Operação realizada com sucesso!"